name: autoblog

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTOBLOG_DB_NAME:?set AUTOBLOG_DB_NAME}
      POSTGRES_USER: ${AUTOBLOG_DB_USERNAME:?set AUTOBLOG_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTOBLOG_DB_PASSWORD:?set AUTOBLOG_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AUTOBLOG_STORAGE_ACCESS_KEY:?set AUTOBLOG_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${AUTOBLOG_STORAGE_SECRET_KEY:?set AUTOBLOG_STORAGE_SECRET_KEY}
    volumes:
      - object-data:/data
    networks:
      - internal

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        until mc alias set storage http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        mc mb --ignore-existing "storage/$${ATTACHMENT_BUCKET}"
    environment:
      ATTACHMENT_BUCKET: ${AUTOBLOG_STORAGE_S3_BUCKET:?set AUTOBLOG_STORAGE_S3_BUCKET}
      MINIO_ROOT_USER: ${AUTOBLOG_STORAGE_ACCESS_KEY:?set AUTOBLOG_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${AUTOBLOG_STORAGE_SECRET_KEY:?set AUTOBLOG_STORAGE_SECRET_KEY}
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: autoblog-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AUTOBLOG_DB_URL: jdbc:postgresql://postgres:5432/${AUTOBLOG_DB_NAME:?set AUTOBLOG_DB_NAME}
      AUTOBLOG_DB_USERNAME: ${AUTOBLOG_DB_USERNAME:?set AUTOBLOG_DB_USERNAME}
      AUTOBLOG_DB_PASSWORD: ${AUTOBLOG_DB_PASSWORD:?set AUTOBLOG_DB_PASSWORD}
      AUTOBLOG_JWT_SECRET: ${AUTOBLOG_JWT_SECRET:?set AUTOBLOG_JWT_SECRET}
      AUTOBLOG_JWT_TTL_MINUTES: ${AUTOBLOG_JWT_TTL_MINUTES:-60}
      AUTOBLOG_CORS_ALLOWED_ORIGINS: ${AUTOBLOG_PUBLIC_ORIGIN:?set AUTOBLOG_PUBLIC_ORIGIN}
      AUTOBLOG_STORAGE_TYPE: s3
      AUTOBLOG_STORAGE_S3_BUCKET: ${AUTOBLOG_STORAGE_S3_BUCKET:?set AUTOBLOG_STORAGE_S3_BUCKET}
      AUTOBLOG_STORAGE_S3_ENDPOINT: http://minio:9000
      AUTOBLOG_STORAGE_S3_PATH_STYLE: "true"
      AUTOBLOG_STORAGE_S3_REGION: ${AUTOBLOG_STORAGE_S3_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AUTOBLOG_STORAGE_ACCESS_KEY:?set AUTOBLOG_STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${AUTOBLOG_STORAGE_SECRET_KEY:?set AUTOBLOG_STORAGE_SECRET_KEY}
    expose:
      - "8080"
      - "9091"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9091/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: autoblog-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      AUTOBLOG_BACKEND_URL: http://backend:8080
      AUTOBLOG_PUBLIC_ORIGIN: ${AUTOBLOG_PUBLIC_ORIGIN:?set AUTOBLOG_PUBLIC_ORIGIN}
    ports:
      - "3000:3000"
    networks:
      - internal

  prometheus:
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  object-data:
  postgres-data:
  prometheus-data:
