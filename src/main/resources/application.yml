spring:
  application:
    name: autoblog
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  error:
    include-message: never
    include-binding-errors: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

autoblog:
  cors:
    allowed-origins: ${AUTOBLOG_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  public-base-url:
  storage:
    type: ${AUTOBLOG_STORAGE_TYPE:local}
    local-root: ./data/uploads
    s3:
      bucket: ${AUTOBLOG_STORAGE_S3_BUCKET:}
      endpoint: ${AUTOBLOG_STORAGE_S3_ENDPOINT:}
      path-style-access: ${AUTOBLOG_STORAGE_S3_PATH_STYLE:false}
      region: ${AUTOBLOG_STORAGE_S3_REGION:eu-central-1}
  attachments:
    max-file-size-mb: 10
  security:
    jwt-secret: ${AUTOBLOG_JWT_SECRET:}
    jwt-ttl-minutes: ${AUTOBLOG_JWT_TTL_MINUTES:60}
